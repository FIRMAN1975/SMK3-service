# Upstream definitions
upstream api_gateway_upstream {
    server api-gateway:3000;
}
upstream keycloak_upstream {
    server keycloak:8080;
}

# Main server block
server {
    listen 80;
    server_name localhost;

    # 1. API Gateway Endpoint (Prefix: /api)
    location /api/ {
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-User-Id, X-User-Name, X-User-Roles' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-User-Id, X-User-Name, X-User-Roles' always;

        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6766;

        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-User-Roles $http_x_user_roles;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 2. Keycloak Endpoint (Root /)
    location / {
        proxy_pass http://keycloak_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6766;

        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 3. Health check endpoint
    location /health {
        access_log off;
        return 200 "smk3 backend infrastructure is healthy\n";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}